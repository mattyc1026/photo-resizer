<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resizer">
<title>Photo Resizer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #e5e5ea;
    --field: #f2f2f7;
    --accent: #007aff;
    --accent-press: #0062cc;
    --danger: #ff3b30;
    --ok: #34c759;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --line: #2c2c2e;
      --field: #2c2c2e;
      --accent: #0a84ff;
      --accent-press: #409cff;
      --danger: #ff453a;
      --ok: #30d158;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin: 8px 4px 18px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 20px; border-radius: 12px;
    font-weight: 600; font-size: 17px;
    background: var(--field); color: var(--accent);
    transition: transform .08s ease, background .15s ease, opacity .15s ease;
    width: 100%;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:active { background: var(--accent-press); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn svg { width: 22px; height: 22px; }

  #drop { text-align: center; }
  #drop .hint-icon { display: none; }

  .row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .row-head .count { font-weight: 600; font-size: 17px; }
  .link { background: none; color: var(--accent); font-size: 16px; padding: 6px 2px; }

  ul#list { list-style: none; margin: 0; padding: 0; }
  #list li {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  #list li:first-child { border-top: 0; }
  .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--field); display: block; }
  .meta { min-width: 0; }
  .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dims-line { color: var(--muted); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .dims-line .arrow { margin: 0 4px; }
  .dims-line .to { color: var(--text); white-space: nowrap; }
  .dims-line .from { white-space: nowrap; }
  .status { font-size: 13px; margin-top: 2px; color: var(--muted); }
  .status.err { color: var(--danger); }
  .status.done { color: var(--ok); }
  .item-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px; background: var(--field); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn.dl { color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; }

  .field-label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; text-transform: uppercase; letter-spacing: .3px; }
  .dims { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
  .dims .x { color: var(--muted); padding-bottom: 14px; font-size: 18px; }
  .input-wrap { position: relative; }
  .input-wrap .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  input[type=number], select {
    width: 100%; height: 50px; border-radius: 12px; border: 0;
    background: var(--field); color: var(--text);
    font: inherit; font-size: 20px; font-weight: 600; padding: 0 40px 0 14px;
    font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number].auto { color: var(--muted); font-weight: 500; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  select { font-size: 17px; font-weight: 500; padding-right: 40px; cursor: pointer; }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; cursor: pointer;
    user-select: none;
  }
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .track { position: absolute; inset: 0; background: var(--line); border-radius: 31px; transition: background .2s; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .2s; }
  .switch input:checked + .track { background: var(--ok); }
  .switch input:checked + .track + .knob { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .quality-head { display: flex; justify-content: space-between; align-items: baseline; }
  .quality-head .val { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }
  input[type=range] { width: 100%; height: 50px; margin: 0; accent-color: var(--accent); background: transparent; }
  .go { margin-top: 16px; }

  .actions { display: grid; gap: 10px; }
  .summary { color: var(--muted); font-size: 14px; text-align: center; margin: 0 0 12px; }

  .drag-overlay {
    position: fixed; inset: 0; background: rgba(0,122,255,.12); border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center; z-index: 10; pointer-events: none;
    font-size: 22px; font-weight: 600; color: var(--accent);
  }
  body.dragging .drag-overlay { display: flex; }

  @media (min-width: 640px) {
    main { padding-top: 40px; }
    .actions { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  }
  @media (max-width: 380px) {
    .grid2 { grid-template-columns: 1fr; }
    #list li { grid-template-columns: 48px 1fr auto; }
    .thumb { width: 48px; height: 48px; }
  }
</style>
</head>
<body>
<div class="drag-overlay">Drop photos</div>
<main>
  <h1>Photo Resizer</h1>

  <section class="card" id="drop">
    <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp" hidden>
    <button class="btn primary" id="addBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="addLabel">Add Photos</span>
    </button>
  </section>


  <section class="card" id="settings" hidden>
    <div class="dims">
      <div>
        <label class="field-label" for="w">Width</label>
        <div class="input-wrap"><input id="w" type="number" inputmode="numeric" min="1" step="1"><span class="unit">px</span></div>
      </div>
      <span class="x">×</span>
      <div>
        <label class="field-label" for="h">Height</label>
        <div class="input-wrap"><input id="h" type="number" inputmode="numeric" min="1" step="1"><span class="unit">px</span></div>
      </div>
    </div>

    <label class="toggle-row" for="keep">
      <span>Keep proportions</span>
      <span class="switch"><input type="checkbox" id="keep" checked><span class="track"></span><span class="knob"></span></span>
    </label>

    <div class="grid2">
      <div>
        <label class="field-label" for="fmt">Save as</label>
        <div class="select-wrap">
          <select id="fmt">
            <option value="jpg">JPG</option>
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
          </select>
        </div>
      </div>
      <div id="qualityRow">
        <div class="quality-head"><label class="field-label" for="q">Quality</label><span class="val" id="qv">90</span></div>
        <input type="range" id="q" min="1" max="100" value="90">
      </div>
    </div>

    <button class="btn primary go" id="goBtn" type="button">Resize</button>
  </section>

  <section class="card" id="results" hidden>
    <p class="summary" id="summary"></p>
    <div class="actions">
      <button class="btn primary" id="zipBtn" type="button">Download ZIP</button>
      <button class="btn" id="allBtn" type="button">Download Separately</button>
      <button class="btn" id="shareBtn" type="button" hidden>Save to Photos</button>
    </div>
  </section>

  <section class="card" id="listCard" hidden>
    <div class="row-head">
      <span class="count" id="count"></span>
      <button class="link" id="clearBtn" type="button">Clear All</button>
    </div>
    <ul id="list"></ul>
  </section>
</main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const fileInput = $('fileInput'), addBtn = $('addBtn'), addLabel = $('addLabel');
  const listCard = $('listCard'), list = $('list'), countEl = $('count'), clearBtn = $('clearBtn');
  const settings = $('settings'), wIn = $('w'), hIn = $('h'), keep = $('keep');
  const fmtSel = $('fmt'), qIn = $('q'), qv = $('qv'), qualityRow = $('qualityRow'), goBtn = $('goBtn');
  const results = $('results'), summary = $('summary'), zipBtn = $('zipBtn'), allBtn = $('allBtn'), shareBtn = $('shareBtn');

  const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' };
  const MAX_PIXELS = 16777216; // safe canvas area across browsers, including iOS Safari

  let items = [];
  let nextId = 1;
  let driver = 'w';
  let busy = false;

  // ---------- helpers ----------
  const isHeic = (f) => /\.(heic|heif)$/i.test(f.name) || /heic|heif/i.test(f.type);
  const baseName = (n) => n.replace(/\.[^.]+$/, '') || 'photo';
  const fmtBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Could not load ' + src));
      document.head.appendChild(s);
    });
  }

  function imgFromBlob(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  async function heicToPng(file) {
    if (!window.heic2any) await loadScript('vendor/heic2any.min.js');
    const out = await window.heic2any({ blob: file, toType: 'image/png' });
    return Array.isArray(out) ? out[0] : out;
  }

  // Returns a Blob the browser can draw (converts HEIC when the browser cannot read it natively)
  async function readable(file) {
    try {
      const r = await imgFromBlob(file);
      URL.revokeObjectURL(r.url);
      return file;
    } catch (e) {
      if (isHeic(file)) return await heicToPng(file);
      throw new Error('Unsupported file');
    }
  }

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  function toBlob(c, mime, q) {
    return new Promise((resolve) => c.toBlob(resolve, mime, q));
  }

  // WebP fallback encoder for browsers whose canvas cannot write WebP (Safari)
  const WEBP_OPTS = {
    quality: 75, target_size: 0, target_PSNR: 0, method: 4, sns_strength: 50, filter_strength: 60,
    filter_sharpness: 0, filter_type: 1, partitions: 0, segments: 4, pass: 1, show_compressed: 0,
    preprocessing: 0, autofilter: 0, partition_limit: 0, alpha_compression: 1, alpha_filtering: 1,
    alpha_quality: 100, lossless: 0, exact: 0, image_hint: 0, emulate_jpeg_size: 0, thread_level: 0,
    low_memory: 0, near_lossless: 100, use_delta_palette: 0, use_sharp_yuv: 0
  };
  let webpModule = null;
  async function webpWasm(c, quality) {
    if (!webpModule) {
      const base = new URL('vendor/webp/', location.href).href;
      const factory = (await import(base + 'webp_enc.js')).default;
      webpModule = await factory({ locateFile: (p) => base + p });
    }
    const data = c.getContext('2d').getImageData(0, 0, c.width, c.height);
    const out = webpModule.encode(data.data, c.width, c.height, Object.assign({}, WEBP_OPTS, { quality }));
    if (!out) throw new Error('WebP encode failed');
    return new Blob([out], { type: 'image/webp' });
  }

  async function makeThumb(blob) {
    const { img, url } = await imgFromBlob(blob);
    const w = img.naturalWidth, h = img.naturalHeight;
    const s = 112 / Math.min(w, h);
    const c = canvas(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)));
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const t = await toBlob(c, 'image/jpeg', 0.8);
    return { w, h, thumb: URL.createObjectURL(t) };
  }

  // ---------- sizing ----------
  function target(item) {
    const W = Math.round(+wIn.value) || 0;
    const H = Math.round(+hIn.value) || 0;
    if (keep.checked) {
      if (driver === 'w' && W > 0) return [W, Math.max(1, Math.round(W * item.h / item.w))];
      if (driver === 'h' && H > 0) return [Math.max(1, Math.round(H * item.w / item.h)), H];
      return null;
    }
    if (!W && !H) return null;
    return [W || item.w, H || item.h];
  }

  function sameRatio() {
    const ready = items.filter((i) => i.w);
    if (!ready.length) return null;
    const r0 = ready[0].w / ready[0].h;
    return ready.every((i) => Math.abs(i.w / i.h - r0) < 0.005) ? ready[0] : null;
  }

  function syncOther() {
    if (!keep.checked) { wIn.classList.remove('auto'); hIn.classList.remove('auto'); return; }
    const other = driver === 'w' ? hIn : wIn;
    const mine = driver === 'w' ? wIn : hIn;
    mine.classList.remove('auto');
    other.classList.add('auto');
    const ref = sameRatio();
    const t = ref ? target(ref) : null;
    if (t) {
      other.value = driver === 'w' ? t[1] : t[0];
      other.placeholder = '';
    } else {
      other.value = '';
      other.placeholder = 'Auto';
    }
  }

  // ---------- rendering ----------
  const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

  function render() {
    const n = items.length;
    listCard.hidden = settings.hidden = n === 0;
    addLabel.textContent = n ? 'Add More Photos' : 'Add Photos';
    countEl.textContent = n + (n === 1 ? ' photo' : ' photos');
    goBtn.textContent = busy ? goBtn.textContent : (n > 1 ? 'Resize ' + n + ' Photos' : 'Resize Photo');
    qualityRow.style.visibility = fmtSel.value === 'png' ? 'hidden' : 'visible';

    list.innerHTML = '';
    for (const it of items) {
      const li = document.createElement('li');
      const t = it.w ? target(it) : null;
      let dims = it.w ? `<span class="from">${it.w} × ${it.h}</span>` : '';
      if (t) dims += `<span class="arrow">→</span><span class="to">${t[0]} × ${t[1]}</span>`;
      let status = '';
      if (it.error) status = `<div class="status err">${it.error}</div>`;
      else if (it.loading) status = `<div class="status">Loading</div>`;
      else if (it.working) status = `<div class="status">Resizing</div>`;
      else if (it.out) status = `<div class="status done">${it.out.name} · ${fmtBytes(it.out.blob.size)}</div>`;
      li.innerHTML = `
        ${it.thumb ? `<img class="thumb" src="${it.thumb}" alt="">` : '<div class="thumb"></div>'}
        <div class="meta"><div class="name"></div><div class="dims-line">${dims}</div>${status}</div>
        <div class="item-actions">
          ${it.out ? `<button class="icon-btn dl" type="button" aria-label="Download" data-dl="${it.id}">${ICON_DL}</button>` : ''}
          <button class="icon-btn" type="button" aria-label="Remove" data-rm="${it.id}">${ICON_X}</button>
        </div>`;
      li.querySelector('.name').textContent = it.file.name;
      list.appendChild(li);
    }

    const done = items.filter((i) => i.out);
    results.hidden = busy || done.length === 0;
    if (done.length) {
      const total = done.reduce((s, i) => s + i.out.blob.size, 0);
      summary.textContent = `${done.length} ${done.length === 1 ? 'photo' : 'photos'} ready · ${fmtBytes(total)}`;
      shareBtn.hidden = !canShareFiles(done);
    }
    goBtn.disabled = busy || !items.some((i) => i.w && target(i));
  }

  function canShareFiles(done) {
    if (!navigator.canShare || !matchMedia('(pointer: coarse)').matches) return false;
    try { return navigator.canShare({ files: done.map((i) => new File([i.out.blob], i.out.name, { type: i.out.blob.type })) }); }
    catch (e) { return false; }
  }

  function invalidate() {
    for (const it of items) it.out = null;
  }

  // ---------- adding files ----------
  async function addFiles(fileList) {
    const files = Array.from(fileList).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
    if (!files.length) return;
    const wasEmpty = items.length === 0;
    const added = files.map((file) => ({ id: nextId++, file, loading: true }));
    items.push(...added);
    invalidate();
    render();
    for (const it of added) {
      try {
        it.src = await readable(it.file);
        const t = await makeThumb(it.src);
        it.w = t.w; it.h = t.h; it.thumb = t.thumb;
      } catch (e) {
        it.error = 'Could not open this file';
      }
      it.loading = false;
      if (wasEmpty && it.w && !wIn.value && !hIn.value) {
        wIn.value = it.w;
        driver = 'w';
      }
      syncOther();
      render();
    }
  }

  // ---------- resizing ----------
  async function resizeOne(it, tw, th, ext, quality) {
    const { img, url } = await imgFromBlob(it.src);
    try {
      let src = img, cw = img.naturalWidth, ch = img.naturalHeight;
      // Step down in halves for a sharper result when shrinking a lot
      while (cw / 2 >= tw && ch / 2 >= th) {
        const nw = Math.round(cw / 2), nh = Math.round(ch / 2);
        const step = canvas(nw, nh);
        const sctx = step.getContext('2d');
        sctx.imageSmoothingEnabled = true;
        sctx.imageSmoothingQuality = 'high';
        sctx.drawImage(src, 0, 0, nw, nh);
        if (src !== img) { src.width = src.height = 0; }
        src = step; cw = nw; ch = nh;
      }
      const out = canvas(tw, th);
      const ctx = out.getContext('2d');
      if (MIME[ext] === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, tw, th); }
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, 0, 0, tw, th);
      if (src !== img) { src.width = src.height = 0; }

      const mime = MIME[ext];
      const q = quality / 100;
      let blob = await toBlob(out, mime, mime === 'image/png' ? undefined : q);
      if (mime === 'image/webp' && (!blob || blob.type !== 'image/webp')) blob = await webpWasm(out, quality);
      out.width = out.height = 0;
      if (!blob) throw new Error('encode');
      return blob;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function resizeAll() {
    if (busy) return;
    const ext = fmtSel.value;
    const quality = +qIn.value;
    const todo = items.filter((i) => i.w && !i.loading);
    if (!todo.length) return;
    busy = true;
    invalidate();
    for (const it of items) it.error = it.w ? null : it.error;
    goBtn.disabled = true;
    const used = new Set();
    let n = 0;
    for (const it of todo) {
      n++;
      goBtn.textContent = `Resizing ${n} of ${todo.length}`;
      const t = target(it);
      if (!t) continue;
      if (t[0] * t[1] > MAX_PIXELS) { it.error = 'Too large for this device'; render(); continue; }
      it.working = true; render();
      try {
        const blob = await resizeOne(it, t[0], t[1], ext, quality);
        let name = `${baseName(it.file.name)}.${ext}`;
        let k = 2;
        while (used.has(name.toLowerCase())) name = `${baseName(it.file.name)} (${k++}).${ext}`;
        used.add(name.toLowerCase());
        it.out = { blob, name };
      } catch (e) {
        it.error = 'Could not resize this photo';
      }
      it.working = false;
      render();
      await sleep(0);
    }
    busy = false;
    render();
    if (!results.hidden) results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ---------- downloads ----------
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  async function makeZip(entries) {
    const enc = new TextEncoder();
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const parts = [], central = [];
    let offset = 0;
    for (const e of entries) {
      const data = new Uint8Array(await e.blob.arrayBuffer());
      const name = enc.encode(e.name);
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(lh, name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch, name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end], { type: 'application/zip' });
  }

  function zipName() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `resized-photos-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.zip`;
  }

  // ---------- events ----------
  addBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

  clearBtn.addEventListener('click', () => {
    for (const it of items) if (it.thumb) URL.revokeObjectURL(it.thumb);
    items = [];
    wIn.value = hIn.value = '';
    driver = 'w';
    syncOther();
    render();
  });

  list.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]');
    const dl = e.target.closest('[data-dl]');
    if (rm) {
      const id = +rm.dataset.rm;
      const it = items.find((i) => i.id === id);
      if (it && it.thumb) URL.revokeObjectURL(it.thumb);
      items = items.filter((i) => i.id !== id);
      syncOther();
      render();
    } else if (dl) {
      const it = items.find((i) => i.id === +dl.dataset.dl);
      if (it && it.out) download(it.out.blob, it.out.name);
    }
  });

  wIn.addEventListener('input', () => { if (keep.checked) driver = 'w'; invalidate(); syncOther(); render(); });
  hIn.addEventListener('input', () => { if (keep.checked) driver = 'h'; invalidate(); syncOther(); render(); });
  keep.addEventListener('change', () => {
    if (keep.checked) {
      const ref = sameRatio();
      if (!wIn.value && hIn.value) driver = 'h'; else driver = 'w';
      if (!wIn.value && !hIn.value && ref) wIn.value = ref.w;
    } else {
      if (!wIn.value && !hIn.value) { const ref = items.find((i) => i.w); if (ref) { wIn.value = ref.w; hIn.value = ref.h; } }
    }
    invalidate(); syncOther(); render();
  });
  fmtSel.addEventListener('change', () => { invalidate(); render(); });
  qIn.addEventListener('input', () => { qv.textContent = qIn.value; invalidate(); render(); });
  goBtn.addEventListener('click', resizeAll);

  zipBtn.addEventListener('click', async () => {
    const done = items.filter((i) => i.out);
    if (!done.length) return;
    zipBtn.disabled = true;
    const label = zipBtn.textContent;
    zipBtn.textContent = 'Preparing ZIP';
    try {
      const zip = await makeZip(done.map((i) => i.out));
      download(zip, zipName());
    } finally {
      zipBtn.textContent = label;
      zipBtn.disabled = false;
    }
  });

  allBtn.addEventListener('click', async () => {
    const done = items.filter((i) => i.out);
    allBtn.disabled = true;
    for (const it of done) { download(it.out.blob, it.out.name); await sleep(450); }
    allBtn.disabled = false;
  });

  shareBtn.addEventListener('click', async () => {
    const done = items.filter((i) => i.out);
    const files = done.map((i) => new File([i.out.blob], i.out.name, { type: i.out.blob.type }));
    try { await navigator.share({ files }); } catch (e) { /* cancelled */ }
  });

  // drag and drop (desktop)
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) { dragDepth++; document.body.classList.add('dragging'); e.preventDefault(); } });
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // paste images (desktop)
  window.addEventListener('paste', (e) => {
    const files = Array.from(e.clipboardData ? e.clipboardData.files : []);
    if (files.length) addFiles(files);
  });

  render();
})();
</script>
</body>
</html>
